{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container mt-2">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">
                        Войти
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
