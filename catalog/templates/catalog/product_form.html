{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block title %}
<div class="row mt-3">
    <div class="col-3"></div>
    <div class="col-6">
    <h5>Добавить/Редактировать продукт</h5>
    </div>
{% endblock %}
{% block content %}
<div class="container mt-2">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.non_field_errors}}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">
                        {% if object %}
                        Сохранить
                        {% else %}
                        Создать
                        {% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
