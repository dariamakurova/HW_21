{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                     <p class="card-text">Вы действительно хотите удалить продукт {{ object.title }} ?</p>
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary mb-3">
                        Удалить
                    </button>
                    <a type="button" class="btn btn-secondary" href="{% url 'catalog:catalog' %}">Отменить</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
